{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hangarin</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .logo-box {
            width: 48px;
            height: 48px;
            background-color: #1e2025;
            color: #ffffff;
            font-weight: bold;
            font-size: 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        h2 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #1e2025;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #1e2025;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: #333740;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
            font-weight: 600;
            margin: 24px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
        }

        .divider span {
            padding: 0 10px;
        }

        .btn-social {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            text-decoration: none;
        }

        .btn-google {
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            color: #111827;
        }

        .btn-github {
            background-color: #1e2025;
            border: 1px solid #1e2025;
            color: #ffffff;
        }

        .footer-text {
            font-size: 13px;
            color: #6b7280;
            margin-top: 24px;
        }

        .footer-text a {
            color: #111827;
            font-weight: 600;
            text-decoration: none;
        }

        .error-msg {
            color: #dc2626;
            font-size: 13px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-box">H</div>
    <h2>Welcome to Hangarin</h2>
    <p class="subtitle">Sign in to manage your tasks</p>

    {% if form.errors %}
        <p class="error-msg">Invalid username or password. Please try again.</p>
    {% endif %}

    <form method="post" action="{% url 'account_login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_login">Username or Email</label>
            <input type="text" name="login" id="id_login" placeholder="Username" required>
        </div>

        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <div class="divider">
        <span>OR</span>
    </div>

    <!-- Active Social Login Links -->
    <a href="/accounts/google/login/" class="btn-social btn-google">
        <strong>G</strong> Continue with Google
    </a>
    <a href="/accounts/github/login/" class="btn-social btn-github">
        <strong>GitHub</strong> Continue with GitHub
    </a>

    <p class="footer-text">
        Don't have a Hangarin account? <a href="{% url 'account_signup' %}">Sign Up</a>
    </p>
</div>

</body>
</html>
