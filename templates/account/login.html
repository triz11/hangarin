{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hangarin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            --btn-dark: #0f172a;
            --btn-dark-hover: #1e293b;
        }
        body {
            background: var(--primary-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35), 0 10px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            transition: all 0.3s ease;
        }
        .brand-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
            color: #ffffff;
            font-weight: 800;
            font-size: 1.85rem;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.3);
        }
        .login-header h2 {
            font-weight: 700;
            color: #0f172a;
            font-size: 1.65rem;
            letter-spacing: -0.5px;
        }
        .login-header p {
            color: #64748b;
            font-size: 0.925rem;
        }
        .form-floating .form-control {
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            padding-left: 1rem;
            font-size: 0.95rem;
        }
        .form-floating .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }
        .btn-primary-custom {
            background: var(--btn-dark);
            border: none;
            border-radius: 12px;
            padding: 0.85rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .btn-primary-custom:hover {
            background: var(--btn-dark-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.35);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin: 1.5rem 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .divider::before { margin-right: .75em; }
        .divider::after { margin-left: .75em; }

        .btn-social {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            text-decoration: none;
            width: 100%;
        }
        .btn-google {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            color: #334155;
        }
        .btn-google:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            color: #0f172a;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
        }
        .btn-github {
            background: #0f172a;
            border: 1.5px solid #0f172a;
            color: #ffffff;
        }
        .btn-github:hover {
            background: #1e293b;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.3);
        }
        .signup-link {
            color: #64748b;
            font-size: 0.9rem;
        }
        .signup-link a {
            color: #0f172a;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .signup-link a:hover {
            color: #3b82f6;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Brand Logo Badge -->
        <div class="brand-icon">
            H
        </div>

        <!-- Title Header -->
        <div class="login-header text-center mb-4">
            <h2 class="mb-1">Welcome to Hangarin</h2>
            <p class="mb-0">Sign in to manage your tasks</p>
        </div>

        <!-- Login Form -->
        <form method="post" action="{% url 'account_login' %}">
            {% csrf_token %}
            
            <div class="form-floating mb-3">
                <input type="text" name="login" class="form-control" id="id_login" placeholder="Username or Email" required autofocus>
                <label for="id_login">Username or Email</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" name="password" class="form-control" id="id_password" placeholder="Password" required>
                <label for="id_password">Password</label>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 mb-3">Sign In</button>
        </form>

        <!-- Divider -->
        <div class="divider">OR</div>

        <!-- Social Connections -->
        <div class="d-flex flex-column gap-2 mb-4">
            <!-- Google Social Login -->
            <a href="{% url 'google_login' %}" class="btn btn-social btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
                    <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                    <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.3s.7 2.6 1.9 5l3.7-2.5z"/>
                    <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
                </svg>
                Continue with Google
            </a>

            <!-- GitHub Social Login -->
            <a href="{% url 'github_login' %}" class="btn btn-social btn-github">
                <i class="bi bi-github fs-5"></i>
                Continue with GitHub
            </a>
        </div>

        <!-- Signup Navigation Link -->
        <div class="text-center signup-link">
            Don't have a Hangarin account? <a href="{% url 'account_signup' %}">Sign Up</a>
        </div>
    </div>

</body>
</html>
