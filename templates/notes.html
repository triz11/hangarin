{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - Hangarin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .navbar-custom { background-color: #0f172a; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .brand-icon { width: 34px; height: 34px; background: linear-gradient(135deg, #3b82f6, #6366f1); border-radius: 8px; font-weight: 800; }
        .nav-link { color: #94a3b8 !important; font-weight: 500; font-size: 0.9rem; margin: 0 4px; border-radius: 8px; padding: 6px 12px !important; }
        .nav-link.active, .nav-link:hover { color: #ffffff !important; background-color: rgba(255,255,255,0.08); }
        .note-card { background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 1.25rem; transition: transform 0.2s; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        .note-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/dashboard/">
                <div class="brand-icon d-flex align-items-center justify-content-center text-white">H</div>
                <span>Hangarin</span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto ms-4">
                    <li class="nav-item"><a class="nav-link" href="/dashboard/"><i class="bi bi-grid-1x2 me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tasks/"><i class="bi bi-check2-square me-1"></i> Tasks</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/notes/"><i class="bi bi-journal-text me-1"></i> Notes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/subtasks/"><i class="bi bi-diagram-2 me-1"></i> Subtasks</a></li>
                </ul>
                <a href="/accounts/logout/" class="btn btn-outline-light btn-sm rounded-3"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Developer Notes</h3>
                <p class="text-secondary small mb-0">Contextual notes and documentation linked to active tasks.</p>
            </div>
            <button class="btn btn-primary rounded-3 px-3 fw-semibold"><i class="bi bi-journal-plus me-1"></i> New Note</button>
        </div>

        <div class="row g-3">
            {% for note in notes %}
            <div class="col-md-6 col-lg-4">
                <div class="note-card">
                    <div>
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="badge bg-primary bg-opacity-10 text-primary fw-semibold px-2.5 py-1 rounded-2 small">{{ note.task }}</span>
                        </div>
                        <p class="text-dark small mb-3 leading-relaxed">{{ note.content }}</p>
                    </div>
                    <div class="border-top pt-2 mt-2 d-flex align-items-center justify-content-between text-secondary small">
                        <span><i class="bi bi-clock me-1"></i>{{ note.created }}</span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
