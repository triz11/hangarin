<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangarin - Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 py-2">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4" href="{% url 'dashboard' %}">Hangarin</a>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-3">
                    <li class="nav-item"><a class="nav-link text-secondary" href="{% url 'dashboard' %}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="{% url 'tasks' %}">Tasks</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{% url 'notes' %}">Notes</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="{% url 'subtasks' %}">SubTasks</a></li>
                    {% if user.is_staff %}
                        <li class="nav-item"><a class="nav-link text-secondary" href="/admin/">Admin</a></li>
                    {% endif %}
                    <li class="nav-item">
                        <form method="post" action="{% url 'account_logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-light btn-sm px-3">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold display-5">All Notes</h1>
            <button class="btn btn-primary px-3 py-2 fw-semibold">Add Note</button>
        </div>

        <div class="card border shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-semibold">Notes</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col" class="py-3 px-4">Task</th>
                                <th scope="col" class="py-3">Content</th>
                                <th scope="col" class="py-3">Created</th>
                                <th scope="col" class="py-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for item in notes %}
                            <tr>
                                <td class="px-4 py-3">{{ item.task }}</td>
                                <td>{{ item.content }}</td>
                                <td>{{ item.created }}</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary me-1">Edit</button>
                                    <button class="btn btn-sm btn-outline-danger">Delete</button>
                                </td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="4" class="text-center py-4 text-muted">No notes found.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
